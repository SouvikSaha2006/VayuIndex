<div class="app-layout">

      <nav class="nav-links">

          </svg>

        <a routerLink="/sandbox" routerLinkActive="active" class="nav-tab">

            <line x1="4" y1="21" x2="4" y2="14"></line>

            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>

            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>

          <span>CPI Methodology</span>

      <div class="nav-status">
        <span class="status-indicator live"></span>
        <span class="status-text">SSE Stream Live</span>
      </div>
    </div>
  </header>

  <!-- Routed Main Application View -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Persistent VayuMitra Floating AI Assistant Widget -->
  <app-vayumitra-chat></app-vayumitra-chat>
</div>
